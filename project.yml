name: Memorise
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MemoriseCore:
    path: Packages/MemoriseCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Memorise:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: MemoriseCore
    configFiles:
      Debug: App/Config/Base.xcconfig
      Release: App/Config/Base.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Memorise
        # ProMotion: let SwiftUI animations, TimelineView and Canvas run up to 120 Hz on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Memorise listens to your guitar to check the note you play.
        UILaunchScreen: {}
        # M6 Lyrics: values come from App/Config/Base.xcconfig (+ gitignored Secrets.xcconfig).
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        GeniusAccessToken: $(GENIUS_ACCESS_TOKEN)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.memorise.spotify
            CFBundleURLSchemes:
              - memorise-spotify
        LSApplicationQueriesSchemes:
          - spotify
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.memorise # TODO: set your bundle id
        DEVELOPMENT_TEAM: "" # TODO: set your Apple team id (or pick it in Signing & Capabilities)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

schemes:
  Memorise:
    build:
      targets:
        Memorise: all
    run:
      config: Debug
    archive:
      config: Release
